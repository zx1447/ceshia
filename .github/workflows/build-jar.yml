name: Auto Build EssentialsX Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'plugin.yml'
      - '.github/workflows/build-jar.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 手动触发

jobs:
  build-plugin-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Get commit hash
        id: commit
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package
        
      - name: Get JAR file name
        id: jar-name
        run: |
          JAR_FILE=$(find target -name "*.jar" -type f | head -1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR file: $JAR_FILE"
          
      - name: Publish latest release (gh CLI, hard failure on error)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="${{ steps.jar-name.outputs.jar_file }}"
          echo "Publishing: $JAR ($(stat -c%s "$JAR") bytes)"
          # always recreate the tag so it points at the commit we just built
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest Build" \
            --notes "Download the JAR below and place it in your server's \`plugins\` folder." \
            --latest
          sleep 3
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$(basename "$JAR")")
          echo "download check: HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Release asset not downloadable"; exit 1; }
          echo "### Release: $JAR" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$(basename "$JAR")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: essentialsx-latest-build
          path: ${{ steps.jar-name.outputs.jar_file }}
          retention-days: 60
